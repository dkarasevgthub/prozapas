<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  // Redirect to login, or home if already authenticated
  try {
    var auth = localStorage.getItem('prozapas_auth_v1');
    if (auth && JSON.parse(auth).userId) {
      location.replace('ProЗапас Главная.dc.html');
    } else {
      location.replace('ProЗапас Вход.dc.html');
    }
  } catch (e) {
    location.replace('ProЗапас Вход.dc.html');
  }
</script>
</head>
<body></body>
</html>
