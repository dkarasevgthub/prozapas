[project]
name = "prozapas-desktop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyqt6==6.11.0",
    "pyserial==3.5",
    # Printing goes through win32print; the package ships wheels only for Windows.
    "pywin32==312; sys_platform == 'win32'",
    "tomli-w==1.2.0",
]

# An application, not a library: uv installs only the dependencies.
[tool.uv]
package = false
